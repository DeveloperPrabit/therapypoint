<div id="chatbot" class="chatbot-container shadow">
  <div class="chat-header bg-primary text-white p-2">
    Ask Me Anything <span style="float:right; cursor:pointer;" onclick="toggleChat()">✖</span>
  </div>
  <div class="chat-body" id="chat-messages" style="height: 300px; overflow-y: scroll; padding: 10px; background: #f9f9f9;"></div>
  <div class="chat-footer p-2">
    <input type="text" id="user-input" placeholder="Type a question..." class="form-control" onkeypress="if(event.key==='Enter'){sendMessage();}">
  </div>
</div>

<style>
.chatbot-container {
  width: 320px;
  position: fixed;
  bottom: 20px;
  right: 20px;
  border-radius: 10px;
  background: white;
  display: none;
  z-index: 9999;
  box-shadow: 0 0 15px rgba(0,0,0,0.3);
}
.chat-header {
  font-weight: 600;
  font-size: 1.1rem;
  user-select: none;
}
.chat-body div {
  margin-bottom: 8px;
}
.chat-body b {
  color: #0d6efd;
}
.chat-footer input {
  width: 100%;
}
button.btn {
  cursor: pointer;
}
</style>

<script>
function toggleChat() {
  const bot = document.getElementById('chatbot');
  bot.style.display = bot.style.display === 'block' ? 'none' : 'block';
  if(bot.style.display === 'block') {
    document.getElementById('user-input').focus();
  }
}

function sendMessage(message = null) {
  const input = document.getElementById('user-input');
  const chatBox = document.getElementById('chat-messages');
  let msg = message || input.value.trim();
  if (!msg) return;

  chatBox.innerHTML += `<div><b>You:</b> ${msg}</div>`;
  input.value = '';
  chatBox.scrollTop = chatBox.scrollHeight;

  fetch("{% url 'chatbot_api' %}", {
    method: "POST",
    headers: {
      'Content-Type': 'application/json',
      'X-CSRFToken': '{{ csrf_token }}'
    },
    body: JSON.stringify({ message: msg })
  })
  .then(response => response.json())
  .then(data => {
    chatBox.innerHTML += `<div><b>Bot:</b> ${data.response}</div>`;
    chatBox.scrollTop = chatBox.scrollHeight;
  })
  .catch(() => {
    chatBox.innerHTML += `<div><b>Bot:</b> Sorry, something went wrong.</div>`;
    chatBox.scrollTop = chatBox.scrollHeight;
  });
}
</script>

<button onclick="toggleChat()" style="position: fixed; bottom: 20px; right: 20px; z-index: 9999;" class="btn btn-primary">💬 Chat</button>
