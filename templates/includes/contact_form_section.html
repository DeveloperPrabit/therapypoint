<!-- Reusable Contact Form Section -->
<section class="py-5 bg-light">
  <div class="container">
    <h3 class="text-center text-danger mb-4" style="font-weight: bold;">Get in Touch</h3>
    <p class="text-center text-muted mb-5">Have questions or want to reach out? Fill in the form below and we’ll get back to you as soon as possible.</p>
    
    <form method="POST" action="{% url 'contact' %}" class="row g-3">
      {% csrf_token %}
      <div class="col-md-6">
        <label for="name" class="form-label">Full Name</label>
        <input type="text" name="name" id="name" class="form-control" required>
      </div>
      <div class="col-md-6">
        <label for="email" class="form-label">Email Address</label>
        <input type="email" name="email" id="email" class="form-control" required>
      </div>
      <div class="col-md-6">
        <label for="phone" class="form-label">Phone</label>
        <input type="tel" name="phone" id="phone" class="form-control" required>
      </div>
      <div class="col-md-6">
        <label for="address" class="form-label">Address</label>
        <input type="text" name="address" id="address" class="form-control" required>
      </div>
      <div class="col-12">
        <label for="service" class="form-label">Services</label>
        <select name="service" id="service" class="form-select" required>
          <option value="">Choose Your Service</option>
          <option>Speech Pathology</option>
          <option>Occupational Therapy</option>
          <option>Information Sessions</option>
          <option>Group Therapy</option>
          <option>Preschool/School and Home Visits</option>
          <option>Intervention</option>
          <option>Assessment</option>
        </select>
      </div>
      <div class="col-12">
        <label class="form-label">Service Locations *</label>
        <div class="form-check">
          <input class="form-check-input" type="checkbox" name="location" value="76 Barbara Blvd" required>
          <label class="form-check-label">76 Barbara Blvd, Seven Hills NSW 2147, Australia</label>
        </div>
        <div class="form-check">
          <input class="form-check-input" type="checkbox" name="location" value="21B Digitaria Drive" required>
          <label class="form-check-label">21B, Level 2, 13 Digitaria Drive, Gledswood Hills NSW 2557</label>
        </div>
      </div>
      <div class="col-12">
        <label for="message" class="form-label">Message</label>
        <textarea name="message" id="message" rows="5" class="form-control" required></textarea>
      </div>
      <div class="col-12 mt-3">
        <div class="form-check">
          <input class="form-check-input" type="checkbox" required>
          <label class="form-check-label">
            I understand, accept and agree to comply with 
            <a href="https://therapypoint.com.au/policy/" target="_blank">Our Policy</a>
          </label>
        </div>
      </div>
      <div class="col-12 text-center">
        <button type="submit" class="btn btn-success px-5 mt-3">Submit</button>
      </div>
    </form>
  </div>
</section>
